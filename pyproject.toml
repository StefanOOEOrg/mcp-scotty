[project]
name = "mcp-scotty"
version = "0.3.0"
description = "MCP Server for public transit information across Europe via HAFAS API (ÖBB, DB, SBB, NS, and more)"
authors = [
    {name = "mcp-scotty Contributors"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

dependencies = [
    "mcp>=2.2,<3",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
